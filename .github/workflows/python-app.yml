# This workflow will install Python dependencies, run lint and tests.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install ruff mypy
    - name: Lint with ruff
      run: |
        ruff check absbox
    - name: Type-check with mypy (advisory)
      # Advisory only: the codebase still carries annotation debt (~30 errors).
      # Remove `|| true` once the baseline reaches zero.
      run: |
        python -m mypy || true
    - name: Test with pytest
      run: |
        python -m pytest absbox/tests
