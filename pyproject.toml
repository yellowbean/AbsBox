[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["absbox*"]
exclude = ["absbox.tests*", "docs*", "notebooks*"]

[project]
version = "0.52.3"
name = "absbox"
description = "an analytical library for cashflow modeling on ABS/MBS products"
readme = "README.md"
requires-python = ">=3.10"
license = {file="LICENSE"}
authors = [
  {email = "always.zhang@gmail.com"},
  {name = "xiaoyu, zhang"}
]
classifiers = [
    "Development Status :: 4 - Beta"
    ,"Environment :: Console"
    ,"Intended Audience :: Developers"
    ,"Intended Audience :: Financial and Insurance Industry"
    ,"Topic :: Software Development :: Build Tools"
    ,"Topic :: Software Development :: Libraries"
    ,"License :: OSI Approved :: Apache Software License"
]

dependencies = [
    "pandas",
    "numpy",
    "requests",
    "toolz",
    "rich",
    "lenses",
    "graphviz",
    "schema",
    "htpy",
    "markupsafe",
    "dateparser",
    "more-itertools",
    "xlsxwriter",
    "matplotlib",
    "numpy-financial",
]


keywords = ["cashflow", "abs", "mbs", "cashflow model", "rmbs" ,"clo", "cashflow engine","structuring", "srt"]



[project.urls]
homepage = "https://absbox.org"
documentation = "https://absbox-doc.readthedocs.io/en/latest/"
repository = "https://github.com/yellowbean/AbsBox/"
changelog = "https://github.com/yellowbean/AbsBox/blob/main/CHANGELOG.rst"




[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --color=yes  --import-mode=importlib"
markers = [
    "pool","account","bond","fee","fees","interest","collect","asset","performance",
    "trigger","report","revolving","TB","analytics","dontrun","waterfall",
    "dates","formula","sensitivity"

]


testpaths = [
    "absbox/tests",
    "docs/source/nbsample"
]


[project.optional-dependencies]
test = [
    "pytest",
    "jsondiff",
    "deepdiff",
    "ipykernel",
    "pytest-notebook",
    "marimo",
]

[tool.towncrier]
directory = "changes"
name = "Absbox"
filename = "CHANGELOG.rst"

start_string = ".. towncrier release notes start\n"
underlines = ["-", "~", "\""]
title_format = "{version} - {project_date}"
issue_format = "`{issue} <https://github.com/yellowbean/AbsBox/issues/{issue}>`_"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "enhance"
name = "Enhance"
showcontent = true

[[tool.towncrier.type]]
directory = "bug"
name = "Bug"
showcontent = true

[dependency-groups]
dev = [
    "deepdiff>=9.1.0",
    "marimo>=0.24.0",
    "pytest>=9.1.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 127
extend-exclude = ["docs", "notebooks", "absbox.egg-info"]

[tool.ruff.lint]
# High-signal checks only: syntax errors and undefined names. These are verified
# clean (pyflakes/mypy were run locally). F401 is intentionally NOT enabled:
# ~100 names in component.py/generic.py/china.py are deliberate re-exports that
# downstream modules and users consume via `from .local.component import *`,
# so removing them would be a breaking change. Widen this set gradually.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# No `python_version` pin: pinning to 3.10 makes mypy mis-parse type statements
# in current third-party stubs (e.g. numpy). It follows the running interpreter.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false
# Public API modules to type-check incrementally.
files = ["absbox/client.py", "absbox/deal.py", "absbox/library.py", "absbox/local/interface.py"]
